# gl-tailscale-cert owns this exact location. A location-level filter pair
# overrides an optional server-level ts-fix pair and dispatches it explicitly.
location = /gl_home.html {
    access_by_lua_file /usr/share/gl-ngx/oui-access.lua;
    add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
    add_header X-Frame-Options DENY;

    header_filter_by_lua_file /usr/share/gl-tailscale-cert/ui-header-filter.lua;
    body_filter_by_lua_file /usr/share/gl-tailscale-cert/ui-dispatch-filter.lua;
}

location ^~ /ts-cert/ {
    alias /usr/share/gl-tailscale-cert/www/;
}
