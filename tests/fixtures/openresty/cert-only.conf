worker_processes 1;
error_log /tmp/ts-cert-openresty-error.log notice;
pid /tmp/ts-cert-openresty.pid;

events { worker_connections 64; }

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    server {
        listen 18080;
        server_name _;
        root /repo/tests/fixtures/openresty;
        index gl_home.html;
        include /repo/src/nginx/ts-cert.conf;
    }
}
